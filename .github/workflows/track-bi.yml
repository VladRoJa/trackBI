name: track-bi

on:
  workflow_dispatch:
  schedule:
    # 1) Todos los días a las 7:00 am (Mexicali = UTC-8) -> 15:00 UTC
    - cron: "0 15 * * *"
    # 2) Último día del mes a las 11:00 pm (Mexicali)
    #    Se programa a las 07:00 UTC del día 1 siguiente
    - cron: "15 7 1 * *"

permissions:
  contents: write    

jobs:
  run-track-bi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para poder hacer push sin bronca

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies + Playwright browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps

      - name: Create .env file for scripts
        run: |
          cat << 'EOF' > .env
          DIRECCION_USER=${{ secrets.DIRECCION_USER }}
          DIRECCION_PASS=${{ secrets.DIRECCION_PASS }}
          DIRECCION_LOGIN_URL=${{ secrets.DIRECCION_LOGIN_URL }}
          DIRECCION_REPORTE_URL=${{ secrets.DIRECCION_REPORTE_URL }}
          KPI_DESEMPENO_URL=${{ secrets.KPI_DESEMPENO_URL }}
          REPORTES_URL=${{ secrets.REPORTES_URL }}

          # En Actions siempre headless
          SHOW_BROWSER=0
          EOF

      - name: Create output folders
        run: |
          mkdir -p data/direccion_ingresos
          mkdir -p data/kpi_desempeno
          mkdir -p data/kpi_ventas_nuevos_socios
          mkdir -p data/
          mkdir -p data/asistencia
          mkdir -p data/rutinas
          mkdir -p data/rutinas/raw


      # ---------- 1) Script de Dirección + KPIs ----------
      - name: Ejecutar reporte Dirección
        working-directory: scripts
        run: |
          python reporte_direccion_ingresos.py

      # ---------- 2) Script de descargas ----------
      - name: Ejecutar descargas (corte caja, venta total, cargos recurrentes)
        working-directory: scripts
        run: |
          python reporte_descargas.py

      # ---------- 3) Script de Asistencia ----------
      - name: Ejecutar reporte asistencia (estadísticas de asistencias)
        working-directory: scripts
        run: |
          python reporte_asistencia.py

      # ---------- 4) Script Socios con y sin rutina ----------
      - name: Ejecutar socios con y sin rutina (fase Gasca)
        working-directory: scripts
        run: |
          python socios_con_y_sin_rutina.py
          
    

      - name: Commit & push updated Excel files
        run: |
          echo "🔍 Estado antes de commit:"
          git status

          # Config identidad del bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Agregar los Excel generados
          git add \
            data/direccion_ingresos/*.xlsx \
            data/kpi_desempeno/*.xlsx \
            data/kpi_ventas_nuevos_socios/*.xlsx \
            data/descargas/*.xlsx \
            data/asistencia/*.xlsx 
            data/rutinas/*.xlsx \
            data/rutinas/raw/*.xlsx \ || echo "Nada que agregar"


          # Si no hay nada staged, salir sin error
          if git diff --cached --quiet; then
            echo "✅ No hay cambios nuevos en los Excel, no se hace commit."
            exit 0
          fi

          # Commit
          MSG="chore: auto-update track BI $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "$MSG"

          echo "🚀 Haciendo push a main..."
          git push origin main

